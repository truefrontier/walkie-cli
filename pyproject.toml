[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "walkie-cli"
version = "0.1.0"
description = "Read-only CLI for Walkie.app meeting transcripts and dictations"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Kevin / True Frontier"}
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.scripts]
walkie = "walkie_cli.cli:main"

[project.urls]
Homepage = "https://github.com/truefrontier/walkie-cli"
Repository = "https://github.com/truefrontier/walkie-cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["walkie_cli*"]
